<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Pelle De Ontwikkelaar</title>
    <!--
      Single-page-apps fallback for GitHub Pages.
      GitHub Pages has no server-side routing, so a direct hit to /services
      (or a refresh) lands here. We encode the path into a query string and
      redirect to the root, where the decoder script in index.html restores it
      before React Router takes over. Root custom domain → keep 0 path segments.
      Technique: https://github.com/rafgraph/spa-github-pages
    -->
    <script type="text/javascript">
      var pathSegmentsToKeep = 0
      var l = window.location
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname
            .split('/')
            .slice(0, 1 + pathSegmentsToKeep)
            .join('/') +
          '/?/' +
          l.pathname
            .slice(1)
            .split('/')
            .slice(pathSegmentsToKeep)
            .join('/')
            .replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash
      )
    </script>
  </head>
  <body></body>
</html>
