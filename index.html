<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg" href="/src/assets/monogram-solid.svg" />

    <!--
      Single-page-apps decoder for GitHub Pages. Restores the original path
      that 404.html stashed in the query string, so deep links like /services
      survive a direct visit or refresh. Must run before React Router mounts.
      Technique: https://github.com/rafgraph/spa-github-pages
    -->
    <script type="text/javascript">
      ;(function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&')
            })
            .join('?')
          window.history.replaceState(
            null,
            null,
            l.pathname.slice(0, -1) + decoded + l.hash
          )
        }
      })(window.location)
    </script>

    <!--
      Route-specific title, meta description, canonical, OG/Twitter tags, and
      JSON-LD are rendered per-page by <PageMeta> (src/components/PageMeta.tsx)
      via React 19's head-hoisting, then frozen into static HTML per route by
      scripts/prerender.mjs. Do not add route-specific tags here — they would
      duplicate what React hoists (React 19 hoists but does not dedupe).
    -->
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
